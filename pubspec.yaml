name: reels_app
description: Personal links and video app
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  video_player: ^2.9.0
  webview_flutter: ^4.9.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#15151E"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
