name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Make app icon
        run: |
          pip install pillow
          python - <<'PY'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("assets", exist_ok=True)
          S = 4096
          OUT = 1024
          BG = (21, 21, 30, 255)
          RED = (255, 51, 85, 255)
          WHITE = (245, 245, 250, 255)
          CLEAR = (0, 0, 0, 0)

          def mark(height_ratio):
              im = Image.new("RGBA", (S, S), CLEAR)
              d = ImageDraw.Draw(im)
              H = S * height_ratio
              W = H * 0.74
              cx = cy = S / 2
              x0, y0, x1, y1 = cx - W / 2, cy - H / 2, cx + W / 2, cy + H / 2
              d.rounded_rectangle((x0, y0, x1, y1), radius=H * 0.12, fill=WHITE)
              n = 6
              hole = H * 0.075
              margin = W * 0.07
              gap = (H - 2 * H * 0.09 - hole) / (n - 1)
              for i in range(n):
                  top = y0 + H * 0.09 + i * gap
                  for left in (x0 + margin, x1 - margin - hole):
                      d.rounded_rectangle((left, top, left + hole, top + hole), radius=hole * 0.25, fill=CLEAR)
              fx0 = x0 + margin * 2 + hole
              fx1 = x1 - margin * 2 - hole
              d.rounded_rectangle((fx0, y0 + H * 0.06, fx1, y1 - H * 0.06), radius=H * 0.05, fill=CLEAR)
              r = (fx1 - fx0) * 0.36
              d.ellipse((cx - r, cy - r, cx + r, cy + r), fill=RED)
              t = r * 0.55
              d.polygon([(cx - t * 0.55, cy - t), (cx - t * 0.55, cy + t), (cx + t * 0.95, cy)], fill=WHITE)
              return im.resize((OUT, OUT), Image.LANCZOS)

          mark(0.56).save("assets/icon_fg.png")
          big = mark(0.72)
          bg = Image.new("RGBA", (OUT, OUT), CLEAR)
          ImageDraw.Draw(bg).rounded_rectangle((0, 0, OUT - 1, OUT - 1), radius=int(OUT * 0.22), fill=BG)
          bg.alpha_composite(big)
          bg.save("assets/icon.png")
          PY
      - name: Generate Android project
        run: flutter create --platforms=android --org com.example --project-name reels_app .
      - name: Add permissions and app name
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="reels_app"/android:label="Reels"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Apply app icon
        run: dart run flutter_launcher_icons
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
